<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NaGo Merchant</title>
<style>
:root{--g:#00BFA6;--n:#102A43;--bg:#F5F8F7;--t:#263238;--m:#78909C;--line:#E3EBE9;--red:#E5484D;--orange:#FF8A34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Be Vietnam Pro",sans-serif;color:var(--t)}button,input{font:inherit}
header{background:var(--n);color:#fff;position:sticky;top:0;z-index:10}.top{max-width:1100px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;background:var(--g);display:grid;place-items:center;font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:#b8c8d2;margin-top:3px}
main{max-width:1100px;margin:auto;padding:20px 18px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}.hero h1{margin:0;color:var(--n);font-size:28px}.muted{color:var(--m);font-size:13px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--g);color:#fff}.btn.red{background:var(--red)}.btn.gray{background:#e8eeee;color:var(--n)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px #00000008}.stat{padding:15px}.stat b{font-size:25px;color:var(--n);display:block;margin-top:6px}.layout{display:grid;grid-template-columns:270px 1fr;gap:16px;margin-top:16px}.card{padding:16px}.shop{padding:13px;border:1px solid var(--line);border-radius:12px;margin-top:9px}.shop.active{border-color:var(--g);background:#effbf9}.order{margin-bottom:12px}.orderhead{display:flex;justify-content:space-between;gap:10px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#e7f8f5;color:#087b6d;font-size:12px;font-weight:700;white-space:nowrap}.pill.orange{background:#fff2e9;color:#b95310}.pill.red{background:#fdecec;color:#b4232a}.pill.blue{background:#eaf2ff;color:#2457a6}.pill.purple{background:#f0ebff;color:#6541b8}.pill.green{background:#e9faf1;color:#18794e}.items{margin:10px 0}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf1f0}.customer{background:#f7faf9;border-radius:12px;padding:11px;margin:10px 0}.actions{display:flex;flex-wrap:wrap;gap:6px}.detail-btn{border:0;background:#eef7f5;color:var(--n);padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-box{background:#f7faf9;border-radius:12px;padding:12px}.modal{position:fixed;inset:0;background:#102a4366;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.modal-card{background:#fff;width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:#eef1f0;border-radius:10px;padding:8px 11px;font-weight:800}.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tab{border:0;background:#e8eeee;color:var(--n);padding:9px 13px;border-radius:10px;font-weight:700;cursor:pointer}.tab.on{background:var(--g);color:#fff}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.top{padding:12px 14px}main{padding:15px}.orderhead{flex-direction:column}}
/* NaGo UX polish */.btn,.detail-btn{min-height:42px}.btn:active,.detail-btn:active{transform:translateY(1px)}.hero{gap:14px}.section-note{white-space:nowrap}.tabs{position:sticky;top:68px;z-index:2;background:var(--bg);padding:8px 0;margin:8px 0}.tab{min-height:40px}.order{border-left:4px solid #dfe9e6}.order .actions{margin-top:10px}.order .actions .btn,.order .actions .detail-btn{flex:1 1 130px}@media(max-width:700px){.hero .actions{width:100%}.hero .actions .btn{flex:1}.tabs{top:60px;overflow-x:auto;flex-wrap:nowrap}.tabs .tab{white-space:nowrap}.section>summary{min-height:48px}.section-body{padding-left:12px;padding-right:12px}}</style>
</head>
<body>
<script>
function merchantHardLogout(){
  try{localStorage.removeItem("nago_merchant_auth")}catch(_){}
  try{sessionStorage.removeItem("nago_merchant_auth")}catch(_){}
  window.location.replace(window.location.pathname+"?login=1&logout=1&t="+Date.now());
}
</script>
<header><div class="top"><div class="brand"><div class="logo">N</div><div><b>NaGo Merchant</b><small>Trung tâm quản lý quán</small></div></div><button class="btn gray" onclick="merchantHardLogout()">Đăng xuất</button></div></header>
<main id="app"><div class="card"><b>Đang tải dữ liệu...</b></div></main><div id="orderModal" class="modal" onclick="if(event.target===this)closeOrderDetail()"><div class="modal-card"><div class="modal-head"><div><b>Chi tiết đơn hàng</b><div id="detailSubtitle" class="muted"></div></div><button class="close" onclick="closeOrderDetail()">✕</button></div><div id="orderDetail" style="margin-top:14px"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rnyymflpnidkgetmdwwx.supabase.co";
const SUPABASE_KEY="sb_publishable_qe7GaF__Mab7MCu6pMbhTg_MzLdiChx";
let db=null;
try{
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:"nago_merchant_auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}catch(e){
  console.error("NaGo Merchant Supabase init error",e);
  db=null;
}
const app=document.getElementById("app");
let user=null,shops=[],merchantRealtime=null,authListener=null,merchantAudio=null,merchantNotifiedOrders=new Set();
const MERCHANT_STORAGE_KEY="nago_merchant_auth";
const labels={pending:"Đã đặt",shop_accepted:"Quán đã nhận",preparing:"Đang chuẩn bị",ready_for_pickup:"Chờ tài xế",driver_assigned:"Đã có tài xế",picked_up:"Đã lấy hàng",delivering:"Đang giao",delivered:"Đã giao",rejected:"Đã từ chối",cancelled:"Đã hủy"};
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n)||0)+"đ";

function withTimeout(promise,ms,label){
 return Promise.race([
   promise,
   new Promise((_,reject)=>setTimeout(()=>reject(new Error(label||"TIMEOUT")),ms))
 ]);
}
function notifyNewOrder(order){
 try{
   if(order?.id && merchantNotifiedOrders.has(order.id))return;
   if(order?.id)merchantNotifiedOrders.add(order.id);
   if("Notification" in window && Notification.permission==="granted") new Notification("NaGo — Đơn mới",{body:"Có đơn hàng mới cần xử lý.",tag:"nago-order-"+(order?.id||Date.now())});
   if(!merchantAudio) merchantAudio=new (window.AudioContext||window.webkitAudioContext)();
   const o=merchantAudio,now=o.currentTime,g=o.createGain(),osc=o.createOscillator();
   osc.type="sine";osc.frequency.setValueAtTime(880,now);osc.frequency.setValueAtTime(660,now+0.16);g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(0.12,now+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+0.32);osc.connect(g);g.connect(o.destination);osc.start(now);osc.stop(now+0.34);
 }catch(_){ }
}
function enableMerchantNotifications(){
 if("Notification" in window && Notification.permission==="default") Notification.requestPermission().catch(()=>{});
 try{if(!merchantAudio)merchantAudio=new (window.AudioContext||window.webkitAudioContext)();}catch(_){ }
}
function showLoadError(message){
 app.innerHTML='<div class="card"><b>NaGo Merchant đang gặp lỗi tải dữ liệu.</b><p class="muted">'+esc(message)+'</p><div class="actions"><button class="btn" onclick="start()">↻ Thử lại</button><button class="btn gray" onclick="logout()">Đăng xuất</button></div></div>';
}
async function start(){
 try{
   if(!db){
     login("Không khởi tạo được kết nối hệ thống. Hãy tải lại trang.");
     return;
   }
   const forceLogin=new URLSearchParams(window.location.search).get("login")==="1";
   if(forceLogin){
     try{localStorage.removeItem(MERCHANT_STORAGE_KEY)}catch(_){}
     try{sessionStorage.removeItem(MERCHANT_STORAGE_KEY)}catch(_){}
     try{await withTimeout(db.auth.signOut({scope:"local"}),3000,"LOGOUT_TIMEOUT")}catch(_){}
     user=null;
     login("Đã đăng xuất. Hãy đăng nhập lại bằng tài khoản nhà bán hàng.");
     return;
   }
   const s=await withTimeout(db.auth.getSession(),7000,"Phiên đăng nhập bị treo hoặc hết thời gian.");
   user=s.data.session?.user||null;
   if(!user){login();return}
   await checkRoleAndLoad();
   if(!authListener){
     authListener=db.auth.onAuthStateChange((_e,s)=>{
       user=s?.user||null;
       if(!user){login()}
       else if(_e!=="SIGNED_OUT"){setTimeout(()=>checkRoleAndLoad(),0)}
     });
   }
 }catch(e){
   console.error("Merchant start error",e);
   try{await db.auth.signOut({scope:"local"})}catch(_){}
   try{localStorage.removeItem(MERCHANT_STORAGE_KEY)}catch(_){}
   user=null;
   login("Phiên đăng nhập cũ bị lỗi. Vui lòng đăng nhập lại.");
 }
}
async function checkRoleAndLoad(){
 if(!user){login();return}
 app.innerHTML='<div class="card"><b>Đang kiểm tra tài khoản Merchant...</b></div>';
 try{
   const r=await withTimeout(
     db.from("profiles").select("role,full_name").eq("id",user.id).maybeSingle(),
     7000,
     "Không nhận được phản hồi từ Supabase khi kiểm tra quyền."
   );
   const profile=r.data,error=r.error;
   if(error){showLoadError(error.message);return}
   if(profile?.role!=="merchant"){
     app.innerHTML='<div class="card"><h2>Tài khoản chưa có quyền Merchant</h2><p class="muted">Tài khoản hiện tại chưa được cấp role Merchant. Hãy đăng xuất và dùng tài khoản Merchant do Admin tạo.</p><button class="btn gray" onclick="logout()">Đăng xuất</button></div>';
     return;
   }
   await load();
 }catch(e){
   console.error("Merchant role check error",e);
   showLoadError(e.message||"Không kiểm tra được quyền Merchant.");
 }
}
function login(message=""){
 app.innerHTML='<div class="card"><h2>Đăng nhập Merchant</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Mật khẩu"><button class="btn" onclick="signin()">Đăng nhập</button>'+(
   message?'<p class="muted" style="margin-top:10px">'+esc(message)+'</p>':''
 )+'<div class="muted">Tài khoản phải có role Merchant và được Admin gán owner_id cho shop.</div></div>';
}
async function signin(){
 const email=document.getElementById("email")?.value.trim();
 const password=document.getElementById("pass")?.value||"";
 if(!email||!password){alert("Nhập email và mật khẩu.");return}
 try{
   try{await withTimeout(db.auth.signOut({scope:"local"}),3000,"RESET_TIMEOUT")}catch(_){}
   try{localStorage.removeItem(MERCHANT_STORAGE_KEY)}catch(_){}
   const r=await withTimeout(db.auth.signInWithPassword({email,password}),10000,"Đăng nhập quá thời gian chờ.");
   if(r.error){alert(r.error.message);return}
   user=r.data.user;
   await checkRoleAndLoad();
 }catch(e){
   alert(e.message||"Không đăng nhập được.");
 }
}
function logout(){
 user=null;
 try{if(merchantRealtime)db.removeChannel(merchantRealtime)}catch(_){}
 merchantRealtime=null;
 try{if(authListener?.data?.subscription)authListener.data.subscription.unsubscribe()}catch(_){}
 authListener=null;
 try{localStorage.removeItem(MERCHANT_STORAGE_KEY)}catch(_){}
 try{sessionStorage.clear()}catch(_){}
 login("Đã đăng xuất. Bạn có thể đăng nhập bằng tài khoản Merchant vừa tạo.");
 Promise.resolve(db.auth.signOut({scope:"local"})).catch(()=>{});
}
async function load(){
 try{
   const r=await withTimeout(
     db.from("shops").select("id,name,address,phone,is_active").eq("owner_id",user.id).order("name"),
     8000,
     "Tải danh sách shop quá thời gian chờ."
   );
   const data=r.data,error=r.error;
   if(error){showLoadError("Không tải được shop: "+error.message);return}
   shops=data||[];
   if(!shops.length){
     app.innerHTML='<div class="card"><b>Chưa có shop được gán cho tài khoản này.</b><p class="muted">Admin cần dùng chức năng gán shop để đặt chủ shop cho tài khoản Merchant.</p><button class="btn gray" onclick="logout()">Đăng xuất</button></div>';
     return;
   }
   const ids=shops.map(x=>x.id); const pr=await db.from("products").select("id,shop_id,name,price,is_available").in("shop_id",ids).order("name"); window.merchantProducts=pr.data||[];
   if(merchantRealtime)try{await db.removeChannel(merchantRealtime)}catch(_){}
   merchantRealtime=db.channel("nago-merchant-orders-"+user.id)
     .on("postgres_changes",{event:"*",schema:"public",table:"orders"},payload=>{
       if(ids.includes(payload.new?.shop_id)||ids.includes(payload.old?.shop_id)){
         if(payload.eventType==="INSERT" || (payload.eventType==="UPDATE" && payload.new?.status==="pending")) notifyNewOrder(payload.new||payload.old);
         setTimeout(()=>load(),0);
       }
     }).subscribe();
   const r2=await withTimeout(
     db.from("orders").select("id,shop_id,status,subtotal,delivery_fee,discount,total,payment_method,payment_status,created_at,address:user_addresses(label,recipient_name,phone,address_line),items:order_items(product_name,quantity,unit_price,line_total)").in("shop_id",ids).order("created_at",{ascending:false}).limit(50),
     10000,
     "Tải danh sách đơn quá thời gian chờ."
   );
   const orders=r2.data,oe=r2.error;
   if(oe){showLoadError("Không tải được đơn: "+oe.message);return}
   render(orders||[]);
 }catch(e){
   console.error("Merchant load error",e);
   showLoadError(e.message||"Không tải được dữ liệu Merchant.");
 }
}
async function merchantAnalytics(){ const r=await db.rpc("merchant_dashboard"); return r.error?null:(r.data?.[0]||null); }
function render(orders){
 const count=s=>orders.filter(o=>o.status===s).length;
 const shopName=shops.length===1?esc(shops[0].name):shops.length+" cửa hàng";
 let html='<div class="hero"><div><div class="muted">Xin chào</div><h1>'+shopName+'</h1><div class="muted">Theo dõi và xử lý đơn hàng theo thời gian thực.</div></div><div class="actions"><button class="btn" onclick="load()">↻ Làm mới</button><button class="btn gray" onclick="enableMerchantNotifications()">🔔 Thông báo đơn</button></div></div>';
 html+='<details class="section"><summary>🍜 Quản lý món ăn</summary><div class="section-body"><div class="actions"><select id="productShop"></select><input id="productName" placeholder="Tên món"><input id="productPrice" type="number" placeholder="Giá (đ)"><button class="btn" onclick="saveNewProduct()">+ Thêm món</button></div><div id="productManager"></div></div></details>'; html+='<details class="section compact"><summary>💡 Cách dùng nhanh <span class="section-note">3 bước</span></summary><div class="section-body"><div class="muted">1️⃣ Nhận đơn mới → 2️⃣ Xác nhận & chuẩn bị → 3️⃣ Bàn giao tài xế.</div></div></details>';html+='<div class="stats"><div class="stat">🆕<div class="muted">Đơn mới</div><b>'+count("pending")+'</b></div><div class="stat">🍳<div class="muted">Đang chuẩn bị</div><b>'+count("preparing")+'</b></div><div class="stat">🛵<div class="muted">Chờ tài xế</div><b>'+count("ready_for_pickup")+'</b></div><div class="stat">✓<div class="muted">Đã giao</div><b>'+count("delivered")+'</b></div></div><details class="section compact"><summary>📊 Doanh thu & hiệu suất<span class="section-note">Mở khi cần xem số liệu</span></summary><div class="section-body"><div id="analytics"><div class="muted">Đang tải...</div></div></div></details>';
 const attention=orders.filter(o=>["pending","preparing","ready_for_pickup"].includes(o.status));
const codOutstanding=orders.filter(o=>o.status==="delivered"&&o.payment_method==="cod"&&o.payment_status==="unpaid");
const attentionCount=attention.length+codOutstanding.length;
html+='<details class="section"'+(attentionCount?' open':'')+'><summary>⚠️ Cần xử lý <span class="section-note">'+attentionCount+' mục</span></summary><div class="section-body"><div class="actions">'+(attention.length?'<span class="pill orange">'+attention.length+' đơn cần xử lý</span>':'')+(codOutstanding.length?'<span class="pill red">'+codOutstanding.length+' đơn COD chưa thu</span>':'')+'</div><div class="muted" style="margin-top:8px">'+(attentionCount?'Có đơn cần xử lý hoặc COD chưa được xác nhận thu tiền.':'Không có việc tồn đọng.')+'</div></div></details>';
html+='<div class="layout"><aside><details class="section" open><summary>🏪 Cửa hàng của tôi</summary><div class="section-body">'+shops.map(s=>'<div class="shop active"><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.address||"Chưa có địa chỉ")+'</div><div class="muted">'+(s.is_active?"● Đang hoạt động":"○ Tạm ngưng")+'</div></div>').join("")+'</div></details></aside><section><details class="section" open><summary>📦 Đơn hàng <span class="section-note">Chọn nhóm đơn cần xử lý</span></summary><div class="section-body"><div class="tabs"><button class="tab on" onclick="filterOrders(\'all\')">Tất cả</button><button class="tab" onclick="filterOrders(\'pending\')">Đơn mới</button><button class="tab" onclick="filterOrders(\'preparing\')">Đang làm</button><button class="tab" onclick="filterOrders(\'ready_for_pickup\')">Chờ tài xế</button><button class="tab" onclick="filterOrders(\'delivering\')">Đang giao</button><button class="tab" onclick="filterOrders(\'delivered\')">Đã giao</button><button class="tab" onclick="filterOrders(\'cancelled\')">Đã hủy</button><button class="tab" onclick="filterOrders(\'cod_unpaid\')">COD chưa thu</button></div><div id="orderList"></div></div></details></section></div>';
 app.innerHTML=html; window.merchantOrders=orders; filterOrders("all"); renderProductManager(); merchantAnalytics().then(a=>{const el=document.getElementById("analytics");if(!el||!a)return;el.innerHTML="<div class=\"stats\" style=\"margin-top:10px\"><div class=\"stat\"><div class=\"muted\">Tổng đơn</div><b>"+a.total_orders+"</b></div><div class=\"stat\"><div class=\"muted\">Đã giao</div><b>"+a.delivered_orders+"</b></div><div class=\"stat\"><div class=\"muted\">Đơn hủy</div><b>"+a.cancelled_orders+"</b></div><div class=\"stat\"><div class=\"muted\">Doanh thu đã giao</div><b>"+money(a.revenue_delivered)+"</b></div></div>";});
}
function renderProductManager(){
 const el=document.getElementById("productManager"),sel=document.getElementById("productShop");if(!el||!sel)return;
 const ps=window.merchantProducts||[];
 sel.innerHTML=shops.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join("");
 el.innerHTML=ps.length?ps.map(p=>'<div class="card" style="margin:8px 0"><div class="row"><div><b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+'</div></div><span class="pill">'+(p.is_available?"Đang bán":"Hết món")+'</span></div><div class="actions" style="margin-top:8px"><button class="btn gray" onclick="editProduct(\''+p.id+'\')">✏️ Sửa</button><button class="btn gray" onclick="toggleProduct(\''+p.id+'\','+(!p.is_available)+')">'+(p.is_available?"Tạm hết":"Bán lại")+'</button></div></div>').join(""):'<div class="muted">Chưa có món.</div>';
}
function editProduct(id){
 const p=(window.merchantProducts||[]).find(x=>x.id===id);if(!p)return;
 const name=prompt("Tên món",p.name);if(name===null)return;
 const price=Number(prompt("Giá món",p.price));if(!Number.isFinite(price)||price<0)return alert("Giá không hợp lệ.");
 updateProduct(id,name.trim(),price,p.is_available);
}
async function updateProduct(id,name,price,available){
 const r=await db.rpc("merchant_manage_product",{p_product_id:id,p_name:name,p_price:price,p_is_available:available});
 if(r.error)return alert(r.error.message);await load();
}
async function saveNewProduct(){
 const shopId=document.getElementById("productShop").value,name=document.getElementById("productName").value.trim(),price=Number(document.getElementById("productPrice").value||0);
 if(!shopId||!name||!Number.isFinite(price)||price<0)return alert("Vui lòng chọn cửa hàng, tên món và giá.");
 const r=await db.rpc("merchant_manage_product",{p_shop_id:shopId,p_name:name,p_price:price,p_is_available:true});
 if(r.error)return alert(r.error.message);
 document.getElementById("productName").value="";document.getElementById("productPrice").value="";await load();
}
async function toggleProduct(id,available){
 const r=await db.rpc("merchant_manage_product",{p_product_id:id,p_is_available:available});
 if(r.error)return alert(r.error.message);await load();
}
function statusPill(status,payment){if(status==="delivered")return payment==="unpaid"?"orange":"green";if(["cancelled","rejected","failed"].includes(status))return "red";if(["driver_assigned","picked_up","delivering"].includes(status))return "purple";if(status==="ready_for_pickup")return "blue";return "orange"}
function filterOrders(status){
 const list=document.getElementById("orderList"); if(!list)return;
 const orders=window.merchantOrders||[]; const arr=status==="all"?orders:status==="cod_unpaid"?orders.filter(o=>o.status==="delivered"&&o.payment_method==="cod"&&o.payment_status==="unpaid"):orders.filter(o=>o.status===status);
 if(!arr.length){list.innerHTML='<div class="card"><b>Không có đơn ở trạng thái này.</b><p class="muted">Đơn mới sẽ xuất hiện tự động.</p></div>';return}
 list.innerHTML=arr.map(o=>{
  const buttons=[];
  if(o.status==="pending")buttons.push('<button class="btn" onclick="move(\''+o.id+'\',\'shop_accepted\')">✓ Nhận đơn</button>','<button class="btn red" onclick="move(\''+o.id+'\',\'rejected\')">Từ chối</button>');
  if(o.status==="shop_accepted")buttons.push('<button class="btn" onclick="move(\''+o.id+'\',\'preparing\')">🍳 Bắt đầu chuẩn bị</button>');
  if(o.status==="preparing")buttons.push('<button class="btn" onclick="move(\''+o.id+'\',\'ready_for_pickup\')">🛵 Sẵn sàng cho tài xế</button>');
  return '<div class="card order"><div class="orderhead"><div><b>Đơn #'+o.id.slice(0,8)+'</b><div class="muted">'+new Date(o.created_at).toLocaleString("vi-VN")+'</div></div><span class="pill">'+(labels[o.status]||o.status)+'</span></div><div class="row"><b>Tổng '+money(o.total)+'</b><span class="muted">'+(o.payment_method==="cod"?"COD":"Điện tử")+" · "+(o.payment_status==="paid"?"Đã thanh toán":"Chưa thanh toán")+'</span></div><div class="actions"><button class="detail-btn" onclick="openOrderDetail(\''+o.id+'\')">👁 Xem chi tiết</button>'+buttons.join("")+'</div></div>';
 }).join("");
}
function openOrderDetail(id){
 const o=(window.merchantOrders||[]).find(x=>x.id===id); if(!o)return;
 const a=o.address||{}; const modal=document.getElementById("orderModal"),box=document.getElementById("orderDetail");
 document.getElementById("detailSubtitle").textContent="Đơn #"+o.id.slice(0,8)+" · "+new Date(o.created_at).toLocaleString("vi-VN");
 box.innerHTML='<div class="detail-grid"><div class="detail-box"><b>📦 Trạng thái</b><div style="margin-top:6px">'+esc(labels[o.status]||o.status)+'</div></div><div class="detail-box"><b>💵 Thanh toán</b><div style="margin-top:6px">'+esc(o.payment_method||"")+' · '+esc(o.payment_status==="paid"?"Đã thanh toán":"Chưa thanh toán")+'</div></div><div class="detail-box"><b>👤 Khách hàng</b><div style="margin-top:6px">'+esc(a.recipient_name||"Khách hàng")+'<br>'+esc(a.phone||"")+'</div></div><div class="detail-box"><b>📍 Giao tới</b><div style="margin-top:6px">'+esc(a.address_line||"Chưa có địa chỉ")+'</div></div></div><h3>Món hàng</h3><div class="items">'+(o.items||[]).map(i=>'<div class="item"><span>'+esc(i.product_name)+' × '+i.quantity+'<div class="muted">'+money(i.unit_price)+'/món</div></span><b>'+money(i.line_total)+'</b></div>').join("")+'</div><div class="detail-box"><div class="row"><span>Tạm tính</span><b>'+money(o.subtotal)+'</b></div><div class="row"><span>Phí giao</span><b>'+money(o.delivery_fee)+'</b></div><div class="row"><span>Giảm giá</span><b>-'+money(o.discount)+'</b></div><div class="row"><b>Tổng cộng</b><b>'+money(o.total)+'</b></div></div><div class="actions" style="margin-top:12px">'+buttonsForMerchantDetail(o)+'</div>';
 modal.classList.add("show");
}
function buttonsForMerchantDetail(o){
 const b=[];
 if(o.status==="pending")b.push('<button class="btn" onclick="moveAndClose(\''+o.id+'\',\'shop_accepted\')">✓ Nhận đơn</button>','<button class="btn red" onclick="moveAndClose(\''+o.id+'\',\'rejected\')">Từ chối</button>');
 if(o.status==="shop_accepted")b.push('<button class="btn" onclick="moveAndClose(\''+o.id+'\',\'preparing\')">🍳 Bắt đầu chuẩn bị</button>');
 if(o.status==="preparing")b.push('<button class="btn" onclick="moveAndClose(\''+o.id+'\',\'ready_for_pickup\')">🛵 Sẵn sàng cho tài xế</button>');
 return b.join("");
}
async function moveAndClose(id,status){closeOrderDetail();await move(id,status)}
function closeOrderDetail(){document.getElementById("orderModal")?.classList.remove("show")}
async function move(id,status){
 const note=status==="rejected"?"Quán từ chối đơn":status==="shop_accepted"?"Quán nhận đơn":status==="preparing"?"Quán bắt đầu chuẩn bị":"Quán đã sẵn sàng cho tài xế";
 const {error}=await db.rpc("merchant_transition_order",{p_order_id:id,p_next_status:status,p_note:note});
 if(error){alert(error.message);return}
 await load();
}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
start();
</script>
