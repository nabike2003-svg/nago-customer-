<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NaGo Driver</title>
<style>
:root{--g:#00BFA6;--n:#102A43;--bg:#F5F8F7;--t:#263238;--m:#78909C;--line:#E3EBE9;--orange:#FF8A34;--red:#E5484D}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Be Vietnam Pro",sans-serif;color:var(--t)}button,input{font:inherit}
header{background:var(--n);color:#fff;position:sticky;top:0;z-index:10}.top{max-width:1000px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:var(--g);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#b8c8d2;margin-top:3px}.wrap{max-width:1000px;margin:auto;padding:20px 18px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}.hero h1{margin:0;color:var(--n);font-size:28px}.muted{color:var(--m);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #00000008}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:25px;color:var(--n);margin-top:5px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}.btn.gray{background:#e8eeee;color:var(--n)}.btn.orange{background:var(--orange)}.pill{padding:6px 9px;border-radius:999px;background:#e7f8f5;color:#087b6d;font-size:12px;font-weight:700}.pill.warn{background:#fff2e9;color:#b95310}.items{margin:10px 0}.item{padding:8px 0;border-bottom:1px solid #edf1f0;display:flex;justify-content:space-between;gap:10px}.customer{background:#f7faf9;border-radius:12px;padding:11px;margin:10px 0}.actions{display:flex;flex-wrap:wrap;gap:6px}.detail-btn{border:0;background:#eef7f5;color:var(--n);padding:9px 12px;border-radius:10px;font-weight:700}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-box{background:#f7faf9;border-radius:12px;padding:12px}.modal{position:fixed;inset:0;background:#102a4366;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.modal-card{background:#fff;width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef1f0;border-radius:10px;padding:8px 11px;font-weight:800}.login{max-width:430px;margin:35px auto}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.approved{background:#e9faf5;color:#18794e;padding:9px 11px;border-radius:10px;font-weight:700}.notapproved{background:#fff3e8;color:#a34a08;padding:9px 11px;border-radius:10px;font-weight:700}
.section{background:#fff;border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}.section>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;color:var(--n);display:flex;justify-content:space-between;align-items:center}.section>summary::-webkit-details-marker{display:none}.section>summary:after{content:"＋";color:var(--m);font-size:18px}.section[open]>summary:after{content:"−"}.section-body{padding:0 16px 16px}.section-note{font-size:12px;color:var(--m);font-weight:400;margin-left:8px}.section.compact>summary{padding:12px 14px;font-size:14px}.section.compact .section-body{padding:0 14px 14px}@media(max-width:700px){.stats{grid-template-columns:1fr}.hero{flex-direction:column;align-items:start}.wrap{padding:15px}.top{padding:12px 14px}}
/* NaGo UX polish */.btn,.detail-btn{min-height:42px}.btn:active,.detail-btn:active{transform:translateY(1px)}.tabs{position:sticky;top:68px;z-index:2;background:var(--bg);padding:8px 0;margin:8px 0}.tab{min-height:40px}.section-note{white-space:nowrap}.actions{gap:8px}@media(max-width:700px){.hero .actions,.statusbar{width:100%}.hero .actions .btn,.statusbar .btn{flex:1}.tabs{top:60px;overflow-x:auto;flex-wrap:nowrap}.tabs .tab{white-space:nowrap}.section>summary{min-height:48px}.section-body{padding-left:12px;padding-right:12px}}
/* NaGo bottom control bar */
body{padding-bottom:82px}.nago-bottom-nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(720px,calc(100% - 20px));background:#102A43f2;border:1px solid #ffffff22;border-radius:18px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:100;box-shadow:0 10px 30px #102A4340;backdrop-filter:blur(10px)}.nago-bottom-nav button{border:0;background:transparent;color:#dce7ec;border-radius:12px;min-height:54px;font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}.nago-bottom-nav button b{font-size:19px;line-height:1}.nago-bottom-nav button.active{background:#00BFA6;color:#fff}.nago-bottom-nav button:active{transform:translateY(1px)}@media(min-width:900px){.nago-bottom-nav{width:600px}}.nago-bottom-nav button{position:relative}.nago-bottom-nav button span{display:flex;align-items:center;gap:5px;justify-content:center}.nago-bottom-nav .nav-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#E5484D;color:#fff;font-size:10px;font-style:normal;font-weight:800;line-height:18px}.nago-bottom-nav{grid-template-columns:repeat(3,1fr)}</style></head><body>
<script>
function driverHardLogout(){
  try{localStorage.removeItem("nago_driver_auth")}catch(_){}
  try{sessionStorage.removeItem("nago_driver_auth")}catch(_){}
  window.location.href=window.location.pathname+"?login=1";
}
</script>
<header><div class="top"><div class="brand"><div class="logo">N</div><div><b>NaGo Driver</b><small>Trung tâm tài xế</small></div></div><button class="btn gray" onclick="driverHardLogout()">Đăng xuất</button></div></header>
<main class="wrap" id="app"><div class="card">Đang tải...</div></main><div id="orderModal" class="modal" onclick="if(event.target===this)closeOrderDetail()"><div class="modal-card"><div class="modal-head"><div><b>Chi tiết đơn hàng</b><div id="detailSubtitle" class="muted"></div></div><button class="close" onclick="closeOrderDetail()">✕</button></div><div id="orderDetail" style="margin-top:14px"></div></div></div>
<nav class="nago-bottom-nav" aria-label="Điều khiển chính"><button data-nav-key="home" class="active" onclick="driverNav('home',this)"><b>⌂</b><span>Trang chủ</span></button><button data-nav-key="income" onclick="driverNav('income',this)"><b>💰</b><span>Thu nhập</span></button><button data-nav-key="personal" onclick="driverNav('personal',this)"><b>♙</b><span>Cá nhân</span></button></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://rnyymflpnidkgetmdwwx.supabase.co","sb_publishable_qe7GaF__Mab7MCu6pMbhTg_MzLdiChx",{auth:{storageKey:"nago_driver_auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,online=false,approved=false,driverRealtime=null,driverStats={delivered:0,revenue:0,assigned:0},driverRating=5;const app=document.getElementById("app");
const labels={ready_for_pickup:"Chờ tài xế",driver_assigned:"Đã nhận đơn",picked_up:"Đã lấy hàng",delivering:"Đang giao",delivered:"Đã giao"};
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n)||0)+"đ";
function notifyDriver(title,body){
 try{if("Notification" in window&&Notification.permission==="granted")new Notification(title,{body,icon:"./manifest.webmanifest"});}catch(e){}
 try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.16);}catch(e){}
}
async function enableDriverNotifications(){
 if(!("Notification" in window))return;
 if(Notification.permission==="default")try{await Notification.requestPermission()}catch(e){}
}
function startDriverRealtime(){
 if(driverRealtime)db.removeChannel(driverRealtime);
 driverRealtime=db.channel("nago-driver-orders")
   .on("postgres_changes",{event:"*",schema:"public",table:"orders"},payload=>{
     const status=payload.new?.status;
     if(status==="ready_for_pickup"||payload.new?.driver_id===user?.id||payload.old?.driver_id===user?.id)load();
   }).subscribe();
}
function handleDriverRealtime(payload){
 const n=payload.new||{}; const o=payload.old||{};
 if(payload.eventType==="INSERT"&&n.status==="ready_for_pickup")notifyDriver("NaGo Driver","Có đơn mới đang chờ nhận.");
 if(payload.eventType==="UPDATE"&&n.driver_id===user?.id&&n.status!==o.status)notifyDriver("NaGo Driver","Đơn #"+String(n.id).slice(0,8)+" → "+(labels[n.status]||n.status));
}
async function start(){
 await enableDriverNotifications();
 const s=await db.auth.getSession();user=s.data.session?.user||null;
 if(!user)return login();
 await checkRoleAndLoad();
 db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(_e==="SIGNED_OUT"){return}if(!user){login()}else{checkRoleAndLoad()}});
}
async function checkRoleAndLoad(){
 const {data:roleRow,error}=await db.from("profiles").select("role").eq("id",user.id).maybeSingle();
 if(error){app.innerHTML='<div class="card"><b>Không kiểm tra được quyền Driver.</b><p class="muted">'+esc(error.message)+'</p></div>';return}
 if(roleRow?.role!=="driver"){
   app.innerHTML='<div class="card"><h2>Tài khoản chưa có quyền Driver</h2><p class="muted">Hãy đăng xuất và dùng tài khoản Driver do Admin tạo.</p><button class="btn gray" onclick="logout()">Đăng xuất</button></div>';
   return;
 }
 await profile();startDriverRealtime();await load();
}
function login(){app.innerHTML='<div class="card"><h2>Đăng nhập tài xế</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Mật khẩu"><button class="btn" onclick="signin()">Đăng nhập</button></div>'}
async function signin(){
 const email=document.getElementById("email")?.value.trim(),password=document.getElementById("pass")?.value||"";
 if(!email||!password)return alert("Nhập email và mật khẩu.");
 try{await db.auth.signOut({scope:"local"})}catch(_){}
 try{localStorage.removeItem("nago_driver_auth")}catch(_){}
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error)return alert(error.message);
 user=data.user;
 await checkRoleAndLoad();
}
async function profile(){
 const {data,error}=await db.from("driver_profiles").select("*").eq("id",user.id).maybeSingle();
 if(error)return alert(error.message);
 if(!data)return alert("Chưa có hồ sơ Driver. Hãy nhờ Admin tạo/duyệt tài khoản Driver.");
 online=!!data.is_online; approved=!!data.is_approved; driverRating=Number(data.rating||5); const sub=document.getElementById("sub"); if(sub)sub.textContent=approved?(online?"🟢 Đang online":"⚪ Đang offline"):"⏳ Chờ Admin duyệt";
}
async function toggleOnline(){
 if(!approved)return alert("Tài khoản Driver chưa được Admin duyệt.");
 const {error}=await db.rpc("driver_set_online",{p_is_online:!online});
 if(error)return alert(error.message);
 await profile();await load();
}
function driverStatusPill(status,payment){if(status==="delivered")return payment==="unpaid"?"orange":"green";if(["cancelled","rejected","failed"].includes(status))return "red";if(["driver_assigned","picked_up","delivering"].includes(status))return "purple";if(status==="ready_for_pickup")return "blue";return "orange"}
function card(o,canClaim){return driverOrderCard(o,canClaim)}
function driverRouteButtons(o){
 let h='';
 if(o.status==="driver_assigned"||o.status==="picked_up"||o.status==="delivering"){
  if(o.delivery_latitude&&o.delivery_longitude)h+='<button class="btn gray" onclick="openMapsRoute(\''+o.delivery_latitude+','+o.delivery_longitude+'\')">🧭 Chỉ đường</button>';
  else if(o.address_line)h+='<button class="btn gray" onclick="openMapsRoute(\''+String(o.address_line).replace(/'/g,"")+'\')">🧭 Chỉ đường</button>';
  if(o.recipient_phone)h+='<button class="btn gray" onclick="callNumber(\''+String(o.recipient_phone).replace(/'/g,"")+'\')">📞 Gọi khách</button>';
  if(o.shop_latitude&&o.shop_longitude)h+='<button class="btn gray" onclick="openMapsRoute(\''+o.shop_latitude+','+o.shop_longitude+'\')">🏪 Chỉ đường tới quán</button>';
  else if(o.shop_address)h+='<button class="btn gray" onclick="openMapsRoute(\''+String(o.shop_address).replace(/'/g,"")+'\')">🏪 Đường tới quán</button>';
 }
 return h;
}
function openMapsRoute(address){window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(address),"_blank","noopener")}
function callNumber(phone){window.location.href="tel:"+phone.replace(/[^0-9+]/g,"")}
function openOrderDetail(id){
 const o=(window.driverOrders||[]).find(x=>x.id===id); if(!o)return;
 document.getElementById("detailSubtitle").textContent="Đơn #"+o.id.slice(0,8)+" · "+new Date(o.created_at).toLocaleString("vi-VN");
 document.getElementById("orderDetail").innerHTML='<div class="detail-grid"><div class="detail-box"><b>🏪 Cửa hàng</b><div style="margin-top:6px">'+esc(o.shop_name||"")+'</div></div><div class="detail-box"><b>📦 Trạng thái</b><div style="margin-top:6px">'+esc(labels[o.status]||o.status)+'</div></div><div class="detail-box"><b>👤 Khách hàng</b><div style="margin-top:6px">'+esc(o.recipient_name||"Khách hàng")+'<br>'+esc(o.recipient_phone||"")+'</div></div><div class="detail-box"><b>📍 Địa chỉ</b><div style="margin-top:6px">'+esc(o.address_line||"Chưa có địa chỉ")+'</div></div><div class="detail-box"><b>💵 Thanh toán</b><div style="margin-top:6px">'+esc(o.payment_method||"")+' · '+esc(o.payment_status==="paid"?"Đã thu":"Chưa thu")+'</div></div></div><h3>Món hàng</h3><div class="items">'+(o.items||[]).map(i=>'<div class="item">'+esc(i.product_name)+' × '+i.quantity+' <b>'+money(i.line_total)+'</b></div>').join("")+'</div><div class="detail-box"><div class="row"><span>Tạm tính</span><b>'+money(o.subtotal)+'</b></div><div class="row"><span>Phí giao</span><b>'+money(o.delivery_fee)+'</b></div><div class="row"><b>Tổng</b><b>'+money(o.total)+'</b></div></div><div class="actions" style="margin-top:12px">'+driverDetailActions(o)+'</div>';
 document.getElementById("orderModal").classList.add("show");
}
function driverDetailActions(o){
 let a='';
 if(!o.driver_id&&o.status==="ready_for_pickup"&&approved&&online)a='<button class="btn" onclick="closeOrderDetail();claim(\''+o.id+'\')">Nhận đơn</button>';
 if(o.driver_id===user.id&&o.status==="driver_assigned")a='<button class="btn" onclick="closeOrderDetail();move(\''+o.id+'\',\'picked_up\')">Đã lấy hàng</button>';
 if(o.driver_id===user.id&&o.status==="picked_up")a='<button class="btn" onclick="closeOrderDetail();move(\''+o.id+'\',\'delivering\')">Bắt đầu giao</button>';
 if(o.driver_id===user.id&&o.status==="delivering")a='<button class="btn" onclick="closeOrderDetail();move(\''+o.id+'\',\'delivered\')">Đã giao</button>';
 if(o.driver_id===user.id&&o.status==="delivered"&&o.payment_method==="cod"&&o.payment_status!=="paid")a='<button class="btn orange" onclick="closeOrderDetail();collectCod(\''+o.id+'\')">💵 Xác nhận đã thu COD</button>';
 return a;
}
function closeOrderDetail(){document.getElementById("orderModal")?.classList.remove("show")}
let driverGpsTimer=null,driverLocation=null;
function distanceKm(lat1,lon1,lat2,lon2){const R=6371,rad=Math.PI/180,dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad,a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function distanceText(lat,lon){if(driverLocation?.lat==null||lat==null||lon==null)return "Đang lấy vị trí…";const km=distanceKm(driverLocation.lat,driverLocation.lon,Number(lat),Number(lon));return km<1?Math.round(km*1000)+" m":km.toFixed(1)+" km"}
function startDriverGps(){if(driverGpsTimer)clearInterval(driverGpsTimer);const update=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{driverLocation={lat:p.coords.latitude,lon:p.coords.longitude};renderDriverHome();},()=>{}, {enableHighAccuracy:true,maximumAge:0,timeout:5000})};update();driverGpsTimer=setInterval(update,3000)}
function stopDriverGps(){if(driverGpsTimer)clearInterval(driverGpsTimer);driverGpsTimer=null}
function driverOrderCard(o,canClaim){
 let action="";
 if(canClaim)action='<button class="btn" onclick="claim(\''+o.id+'\')">Nhận đơn</button>';
 if(o.driver_id===user?.id&&o.status==="driver_assigned")action='<button class="btn" onclick="move(\''+o.id+'\',\'picked_up\')">Đã lấy hàng</button>';
 if(o.driver_id===user?.id&&o.status==="picked_up")action='<button class="btn" onclick="move(\''+o.id+'\',\'delivering\')">Bắt đầu giao</button>';
 if(o.driver_id===user?.id&&o.status==="delivering")action='<button class="btn" onclick="move(\''+o.id+'\',\'delivered\')">Đã giao</button>';
 if(o.driver_id===user?.id&&o.status==="delivered"&&o.payment_method==="cod"&&o.payment_status!=="paid")action+='<button class="btn orange" onclick="collectCod(\''+o.id+'\')">💵 Thu COD</button>';
 const shopDist=o.shop_latitude&&o.shop_longitude?distanceText(o.shop_latitude,o.shop_longitude):"Chưa có tọa độ quán";
 const customerDist=o.delivery_latitude&&o.delivery_longitude?distanceText(o.delivery_latitude,o.delivery_longitude):"Chưa có tọa độ khách";
 return '<div class="card order"><div class="orderhead"><div><b>#'+o.id.slice(0,8)+'</b><div class="muted">'+esc(o.shop_name||"")+'</div></div><span class="pill '+driverStatusPill(o.status,o.payment_status)+'">'+(labels[o.status]||o.status)+'</span></div><div class="detail-box" style="margin-top:9px"><div class="row"><span>📍 Đến quán</span><b>'+shopDist+'</b></div><div class="row"><span>🏠 Đến khách</span><b>'+customerDist+'</b></div></div><div class="row" style="margin-top:8px"><b>'+money(o.total)+'</b><span class="muted">'+(o.payment_method==="cod"?(o.payment_status==="paid"?"Đã thu COD":"COD chưa thu"):"")+'</span></div><div class="actions"><button class="detail-btn" onclick="openOrderDetail(\''+o.id+'\')">👁 Chi tiết</button>'+driverRouteButtons(o)+action+'</div></div>';
}
async function driverFetchOrders(){
 const h=await db.rpc("driver_get_order_history"); if(h.error)throw h.error;
 let all=h.data||[];
 if(approved&&online){const f=await db.rpc("driver_get_orders");if(f.error)throw f.error;const map=new Map(all.map(o=>[o.id,o]));(f.data||[]).forEach(o=>map.set(o.id,o));all=[...map.values()]}
 window.driverOrders=all;return all;
}
function renderDriverHome(){
 const all=window.driverOrders||[],mine=all.filter(o=>o.driver_id===user?.id),waiting=all.filter(o=>o.status==="ready_for_pickup"&&!o.driver_id),active=mine.filter(o=>["driver_assigned","picked_up","delivering"].includes(o.status)),cod=mine.filter(o=>o.status==="delivered"&&o.payment_method==="cod"&&o.payment_status==="unpaid");
 const activeHtml=active.length?active.map(o=>driverOrderCard(o,false)).join(""):'<div class="card"><span class="muted">Bạn chưa có cuốc đang nhận.</span></div>';
 const waitHtml=waiting.length?waiting.map(o=>driverOrderCard(o,true)).join(""):'<div class="card"><span class="muted">Hiện chưa có đơn chờ nhận.</span></div>';
 app.innerHTML='<div class="hero"><div><div class="muted">NaGo Driver</div><h1>'+ (online?"🟢 Đang online":"⚪ Đang offline")+'</h1><div class="muted">Vị trí và đơn hàng được cập nhật tự động mỗi 3 giây.</div></div><button class="btn '+(online?"orange":"")+'" onclick="toggleOnline()">'+(online?"Tắt Online":"Bật Online")+'</button></div><div class="stats"><div class="stat">📦<div class="muted">Đang nhận</div><b>'+active.length+'</b></div><div class="stat">🛵<div class="muted">Chờ nhận</div><b>'+waiting.length+'</b></div><div class="stat">💵<div class="muted">COD chưa thu</div><b>'+cod.length+'</b></div><div class="stat">⭐<div class="muted">Đánh giá</div><b>'+driverRating.toFixed(1)+'</b></div></div><h3>Đơn đang nhận</h3>'+activeHtml+'<h3 style="margin-top:18px">Đơn chưa có tài xế</h3>'+waitHtml;
}
async function load(){try{await driverFetchOrders();renderDriverHome();}catch(e){app.innerHTML='<div class="card"><b>Không tải được đơn.</b><p class="muted">'+esc(e.message||"Lỗi tải dữ liệu")+'</p></div>'}}
async function renderDriverIncome(range="day"){
 const all=await driverFetchOrders(), mine=all.filter(o=>o.driver_id===user?.id&&o.status==="delivered"),now=new Date(),start=new Date(now);
 if(range==="day")start.setHours(0,0,0,0);if(range==="month"){start.setDate(1);start.setHours(0,0,0,0)}if(range==="year"){start.setMonth(0,1);start.setHours(0,0,0,0)}
 const rows=mine.filter(o=>new Date(o.created_at)>=start);
 const income=rows.reduce((s,o)=>s+Number(o.delivery_fee||0),0);
 app.innerHTML='<div class="hero"><div><div class="muted">NaGo Driver</div><h1>Thu nhập</h1></div></div><div class="tabs"><button class="tab '+(range==="day"?"on":"")+'" onclick="renderDriverIncome(\'day\')">Ngày</button><button class="tab '+(range==="month"?"on":"")+'" onclick="renderDriverIncome(\'month\')">Tháng</button><button class="tab '+(range==="year"?"on":"")+'" onclick="renderDriverIncome(\'year\')">Năm</button></div><div class="card"><div class="muted">Thu nhập giao hàng tạm tính</div><h2>'+money(income)+'</h2><div class="muted">Hiện hệ thống đang dùng phí giao hàng làm số tạm tính; chưa cấu hình chia sẻ/hoa hồng riêng cho tài xế.</div></div><div style="margin-top:10px">'+(rows.length?rows.map(o=>'<div class="card order"><div class="row"><b>#'+o.id.slice(0,8)+'</b><b>'+money(o.delivery_fee||0)+'</b></div><div class="muted">'+new Date(o.created_at).toLocaleString("vi-VN")+' · '+esc(o.shop_name||"")+'</div></div>').join(""):'<div class="card"><span class="muted">Chưa có cuốc đã giao trong khoảng này.</span></div>')+'</div>';
}
function renderDriverPersonal(){
 app.innerHTML='<div class="hero"><div><div class="muted">NaGo Driver</div><h1>Cá nhân</h1></div></div><div class="card"><b>👤 Hồ sơ tài xế</b><div class="muted" style="margin-top:6px">'+esc(user?.email||"")+'</div><div class="muted">⭐ '+driverRating.toFixed(1)+' / 5</div><div class="muted">'+(approved?"Đã được Admin duyệt":"Chưa được duyệt")+'</div></div><div class="actions" style="margin-top:14px"><button class="btn gray" onclick="load()">↻ Làm mới dữ liệu</button><button class="btn red" onclick="logout()">Đăng xuất</button></div>';
}
function driverNav(key,btn){document.querySelectorAll(".nago-bottom-nav button").forEach(x=>x.classList.remove("active"));btn?.classList.add("active");stopDriverGps();if(key==="home"){if(online)startDriverGps();renderDriverHome()}if(key==="income")renderDriverIncome("day");if(key==="personal")renderDriverPersonal()}
function filterDriverOrders(status){const list=document.getElementById("myOrderList");if(!list)return;const orders=window.driverOrders||[];const mine=orders.filter(o=>o.driver_id===user.id);const arr=status==="all"?mine:status==="active"?mine.filter(o=>["driver_assigned","picked_up","delivering"].includes(o.status)):status==="cod_unpaid"?mine.filter(o=>o.status==="delivered"&&o.payment_method==="cod"&&o.payment_status==="unpaid"):mine.filter(o=>o.status===status);list.innerHTML=arr.length?arr.map(o=>card(o,false)).join(""):'<div class="card"><span class="muted">Không có đơn ở bộ lọc này.</span></div>'}
async function collectCod(id){
 if(!confirm('Xác nhận đã thu đủ tiền COD từ khách?'))return;
 const {error}=await db.rpc("driver_confirm_cod_collection",{p_order_id:id,p_note:"Tài xế xác nhận đã thu tiền COD"});
 if(error)return alert(error.message);
 await load();
}
async function claim(id){const {error}=await db.rpc("driver_claim_order",{p_order_id:id});if(error)return alert(error.message);await load()}
async function move(id,status){const notes={picked_up:"Tài xế đã lấy hàng",delivering:"Tài xế bắt đầu giao",delivered:"Tài xế xác nhận đã giao"};const {error}=await db.rpc("driver_transition_order",{p_order_id:id,p_next_status:status,p_note:notes[status]});if(error)return alert(error.message);await load()}
async function loadDriverReport(days){
 const el=document.getElementById('driverReport'); if(!el)return;
 el.innerHTML='<div class="muted">Đang tải...</div>';
 const {data,error}=await db.rpc('driver_operations_report',{p_days:days});
 if(error){el.innerHTML='<div class="card"><b>Không tải được báo cáo.</b><div class="muted">'+String(error.message||'').replace(/</g,'&lt;')+'</div></div>';return}
 const d=data||{};
 el.innerHTML='<div class="stats"><div class="stat">📦<div class="muted">Đơn nhận</div><b>'+(d.assigned||0)+'</b></div><div class="stat">✅<div class="muted">Đã giao</div><b>'+(d.delivered||0)+'</b></div><div class="stat">💵<div class="muted">COD đã thu</div><b>'+money(d.cod_collected)+'</b></div><div class="stat">⚠️<div class="muted">COD chưa thu</div><b>'+money(d.cod_outstanding)+'</b></div><div class="stat">⭐<div class="muted">Đánh giá</div><b>'+Number(d.rating||5).toFixed(1)+'</b></div></div>';
}
function logout(){
 user=null;
 try{localStorage.removeItem("nago_driver_auth")}catch(_){}
 try{sessionStorage.removeItem("nago_driver_auth")}catch(_){}
 Promise.resolve(db.auth.signOut({scope:"local"})).catch(()=>{});
 login();
}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
start();

</script></body></html>
