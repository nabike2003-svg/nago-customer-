<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NaGo Driver</title>
<style>
:root{--g:#00BFA6;--n:#102A43;--bg:#F5F8F7;--t:#263238;--m:#78909C;--line:#E3EBE9;--orange:#FF8A34;--red:#E5484D}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Be Vietnam Pro",sans-serif;color:var(--t)}button,input{font:inherit}
header{background:var(--n);color:#fff;position:sticky;top:0;z-index:10}.top{max-width:1000px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:var(--g);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#b8c8d2;margin-top:3px}.wrap{max-width:1000px;margin:auto;padding:20px 18px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}.hero h1{margin:0;color:var(--n);font-size:28px}.muted{color:var(--m);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #00000008}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:25px;color:var(--n);margin-top:5px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}.btn.gray{background:#e8eeee;color:var(--n)}.btn.orange{background:var(--orange)}.pill{padding:6px 9px;border-radius:999px;background:#e7f8f5;color:#087b6d;font-size:12px;font-weight:700}.pill.warn{background:#fff2e9;color:#b95310}.items{margin:10px 0}.item{padding:8px 0;border-bottom:1px solid #edf1f0;display:flex;justify-content:space-between;gap:10px}.customer{background:#f7faf9;border-radius:12px;padding:11px;margin:10px 0}.actions{display:flex;flex-wrap:wrap;gap:6px}.detail-btn{border:0;background:#eef7f5;color:var(--n);padding:9px 12px;border-radius:10px;font-weight:700}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-box{background:#f7faf9;border-radius:12px;padding:12px}.modal{position:fixed;inset:0;background:#102a4366;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.modal-card{background:#fff;width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef1f0;border-radius:10px;padding:8px 11px;font-weight:800}.login{max-width:430px;margin:35px auto}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.approved{background:#e9faf5;color:#18794e;padding:9px 11px;border-radius:10px;font-weight:700}.notapproved{background:#fff3e8;color:#a34a08;padding:9px 11px;border-radius:10px;font-weight:700}
.section{background:#fff;border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}.section>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;color:var(--n);display:flex;justify-content:space-between;align-items:center}.section>summary::-webkit-details-marker{display:none}.section>summary:after{content:"＋";color:var(--m);font-size:18px}.section[open]>summary:after{content:"−"}.section-body{padding:0 16px 16px}.section-note{font-size:12px;color:var(--m);font-weight:400;margin-left:8px}.section.compact>summary{padding:12px 14px;font-size:14px}.section.compact .section-body{padding:0 14px 14px}@media(max-width:700px){.stats{grid-template-columns:1fr}.hero{flex-direction:column;align-items:start}.wrap{padding:15px}.top{padding:12px 14px}}
</style></head><body>
<script>
function driverHardLogout(){
  try{localStorage.removeItem("nago_driver_auth")}catch(_){}
  try{sessionStorage.removeItem("nago_driver_auth")}catch(_){}
  window.location.href=window.location.pathname+"?login=1";
}
</script>
<header><div class="top"><div class="brand"><div class="logo">N</div><div><b>NaGo Driver</b><small>Trung tâm tài xế</small></div></div><button class="btn gray" onclick="driverHardLogout()">Đăng xuất</button></div></header>
<main class="wrap" id="app"><div class="card">Đang tải...</div></main><div id="orderModal" class="modal" onclick="if(event.target===this)closeOrderDetail()"><div class="modal-card"><div class="modal-head"><div><b>Chi tiết đơn hàng</b><div id="detailSubtitle" class="muted"></div></div><button class="close" onclick="closeOrderDetail()">✕</button></div><div id="orderDetail" style="margin-top:14px"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://rnyymflpnidkgetmdwwx.supabase.co","sb_publishable_qe7GaF__Mab7MCu6pMbhTg_MzLdiChx",{auth:{storageKey:"nago_driver_auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,online=false,approved=false,driverRealtime=null,driverStats={delivered:0,revenue:0,assigned:0},driverRating=5;const app=document.getElementById("app");
const labels={ready_for_pickup:"Chờ tài xế",driver_assigned:"Đã nhận đơn",picked_up:"Đã lấy hàng",delivering:"Đang giao",delivered:"Đã giao"};
const money=n=>new Intl.NumberFormat("vi-VN").format(Number(n)||0)+"đ";
function notifyDriver(title,body){
 try{if("Notification" in window&&Notification.permission==="granted")new Notification(title,{body,icon:"./manifest.webmanifest"});}catch(e){}
 try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.16);}catch(e){}
}
async function enableDriverNotifications(){
 if(!("Notification" in window))return;
 if(Notification.permission==="default")try{await Notification.requestPermission()}catch(e){}
}
function startDriverRealtime(){
 if(driverRealtime)db.removeChannel(driverRealtime);
 driverRealtime=db.channel("nago-driver-orders")
   .on("postgres_changes",{event:"*",schema:"public",table:"orders"},payload=>{
     const status=payload.new?.status;
     if(status==="ready_for_pickup"||payload.new?.driver_id===user?.id||payload.old?.driver_id===user?.id)load();
   }).subscribe();
}
function handleDriverRealtime(payload){
 const n=payload.new||{}; const o=payload.old||{};
 if(payload.eventType==="INSERT"&&n.status==="ready_for_pickup")notifyDriver("NaGo Driver","Có đơn mới đang chờ nhận.");
 if(payload.eventType==="UPDATE"&&n.driver_id===user?.id&&n.status!==o.status)notifyDriver("NaGo Driver","Đơn #"+String(n.id).slice(0,8)+" → "+(labels[n.status]||n.status));
}
async function start(){
 await enableDriverNotifications();
 const s=await db.auth.getSession();user=s.data.session?.user||null;
 if(!user)return login();
 await checkRoleAndLoad();
 db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(_e==="SIGNED_OUT"){return}if(!user){login()}else{checkRoleAndLoad()}});
}
async function checkRoleAndLoad(){
 const {data:roleRow,error}=await db.from("profiles").select("role").eq("id",user.id).maybeSingle();
 if(error){app.innerHTML='<div class="card"><b>Không kiểm tra được quyền Driver.</b><p class="muted">'+esc(error.message)+'</p></div>';return}
 if(roleRow?.role!=="driver"){
   app.innerHTML='<div class="card"><h2>Tài khoản chưa có quyền Driver</h2><p class="muted">Hãy đăng xuất và dùng tài khoản Driver do Admin tạo.</p><button class="btn gray" onclick="logout()">Đăng xuất</button></div>';
   return;
 }
 await profile();startDriverRealtime();await load();
}
function login(){app.innerHTML='<div class="card"><h2>Đăng nhập tài xế</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Mật khẩu"><button class="btn" onclick="signin()">Đăng nhập</button></div>'}
async function signin(){
 const email=document.getElementById("email")?.value.trim(),password=document.getElementById("pass")?.value||"";
 if(!email||!password)return alert("Nhập email và mật khẩu.");
 try{await db.auth.signOut({scope:"local"})}catch(_){}
 try{localStorage.removeItem("nago_driver_auth")}catch(_){}
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error)return alert(error.message);
 user=data.user;
 await checkRoleAndLoad();
}
async function profile(){
 const {data,error}=await db.from("driver_profiles").select("*").eq("id",user.id).maybeSingle();
 if(error)return alert(error.message);
 if(!data)return alert("Chưa có hồ sơ Driver. Hãy nhờ Admin tạo/duyệt tài khoản Driver.");
 online=!!data.is_online; approved=!!data.is_approved; driverRating=Number(data.rating||5); const sub=document.getElementById("sub"); if(sub)sub.textContent=approved?(online?"🟢 Đang online":"⚪ Đang offline"):"⏳ Chờ Admin duyệt";
}
async function toggleOnline(){
 if(!approved)return alert("Tài khoản Driver chưa được Admin duyệt.");
 const {error}=await db.rpc("driver_set_online",{p_is_online:!online});
 if(error)return alert(error.message);
 await profile();await load();
}
function card(o,canClaim){
 let action="";
 if(canClaim)action='<button class="btn" onclick="claim(\''+o.id+'\')">Nhận đơn</button>';
 if(o.status==="driver_assigned")action='<button class="btn" onclick="move(\''+o.id+'\',\'picked_up\')">Đã lấy hàng</button>';
 if(o.status==="picked_up")action='<button class="btn" onclick="move(\''+o.id+'\',\'delivering\')">Bắt đầu giao</button>';
 if(o.status==="delivering")action='<button class="btn" onclick="move(\''+o.id+'\',\'delivered\')">Đã giao</button>';
 if(o.status==="delivered"&&o.payment_method==="cod"&&o.payment_status!=="paid")action+='<button class="btn orange" onclick="collectCod(\''+o.id+'\')">💵 Xác nhận đã thu COD</button>';
 return '<div class="card"><div class="row"><div><b>Đơn #'+o.id.slice(0,8)+'</b><div class="muted">'+esc(o.shop_name)+'</div></div><span class="pill">'+(labels[o.status]||o.status)+'</span></div><div class="row"><b>Tổng: '+money(o.total)+'</b><span class="muted">'+(o.payment_method==="cod"?"COD":"Điện tử")+(o.payment_method==="cod"?" · "+(o.payment_status==="paid"?"Đã thu COD":"Chưa thu COD"):"")+'</span></div><div class="actions"><button class="detail-btn" onclick="openOrderDetail(\''+o.id+'\')">👁 Xem chi tiết</button>'+action+'</div></div>';
}
function openOrderDetail(id){
 const o=(window.driverOrders||[]).find(x=>x.id===id); if(!o)return;
 document.getElementById("detailSubtitle").textContent="Đơn #"+o.id.slice(0,8)+" · "+new Date(o.created_at).toLocaleString("vi-VN");
 document.getElementById("orderDetail").innerHTML='<div class="detail-grid"><div class="detail-box"><b>🏪 Cửa hàng</b><div style="margin-top:6px">'+esc(o.shop_name||"")+'</div></div><div class="detail-box"><b>📦 Trạng thái</b><div style="margin-top:6px">'+esc(labels[o.status]||o.status)+'</div></div><div class="detail-box"><b>👤 Khách hàng</b><div style="margin-top:6px">'+esc(o.recipient_name||"Khách hàng")+'<br>'+esc(o.recipient_phone||"")+'</div></div><div class="detail-box"><b>📍 Địa chỉ</b><div style="margin-top:6px">'+esc(o.address_line||"Chưa có địa chỉ")+'</div></div><div class="detail-box"><b>💵 Thanh toán</b><div style="margin-top:6px">'+esc(o.payment_method||"")+' · '+esc(o.payment_status==="paid"?"Đã thu":"Chưa thu")+'</div></div></div><h3>Món hàng</h3><div class="items">'+(o.items||[]).map(i=>'<div class="item">'+esc(i.product_name)+' × '+i.quantity+' <b>'+money(i.line_total)+'</b></div>').join("")+'</div><div class="detail-box"><div class="row"><span>Tạm tính</span><b>'+money(o.subtotal)+'</b></div><div class="row"><span>Phí giao</span><b>'+money(o.delivery_fee)+'</b></div><div class="row"><b>Tổng</b><b>'+money(o.total)+'</b></div></div><div class="actions" style="margin-top:12px">'+driverDetailActions(o)+'</div>';
 document.getElementById("orderModal").classList.add("show");
}
function driverDetailActions(o){
 let a='';
 if(!o.driver_id&&o.status==="ready_for_pickup"&&approved&&online)a='<button class="btn" onclick="closeOrderDetail();claim(\''+o.id+'\')">Nhận đơn</button>';
 if(o.driver_id===user.id&&o.status==="driver_assigned")a='<button class="btn" onclick="closeOrderDetail();move(\''+o.id+'\',\'picked_up\')">Đã lấy hàng</button>';
 if(o.driver_id===user.id&&o.status==="picked_up")a='<button class="btn" onclick="closeOrderDetail();move(\''+o.id+'\',\'delivering\')">Bắt đầu giao</button>';
 if(o.driver_id===user.id&&o.status==="delivering")a='<button class="btn" onclick="closeOrderDetail();move(\''+o.id+'\',\'delivered\')">Đã giao</button>';
 if(o.driver_id===user.id&&o.status==="delivered"&&o.payment_method==="cod"&&o.payment_status!=="paid")a='<button class="btn orange" onclick="closeOrderDetail();collectCod(\''+o.id+'\')">💵 Xác nhận đã thu COD</button>';
 return a;
}
function closeOrderDetail(){document.getElementById("orderModal")?.classList.remove("show")}
async function load(){
 if(!user)return;
 let all=[];
 const historyResult=await db.rpc("driver_get_order_history");
 if(historyResult.error){app.innerHTML='<div class="card"><b>Không tải được lịch sử đơn.</b><p class="muted">'+esc(historyResult.error.message)+'</p><button class="btn gray" onclick="logout()">Đăng xuất</button></div>';return}
 all=historyResult.data||[];
 if(approved&&online){
   const {data,error}=await db.rpc("driver_get_orders");
   if(error){app.innerHTML='<div class="card"><b>Không tải được đơn.</b><p class="muted">'+esc(error.message)+'</p><button class="btn gray" onclick="logout()">Đăng xuất</button></div>';return}
   const feed=data||[];
   const byId=new Map(all.map(o=>[o.id,o]));
   feed.forEach(o=>byId.set(o.id,o));
   all=[...byId.values()];
 }
 const mine=all.filter(o=>o.driver_id===user.id), waiting=all.filter(o=>o.status==="ready_for_pickup"&&!o.driver_id);
 window.driverOrders=all; const delivered=mine.filter(o=>o.status==="delivered");
 driverStats={delivered:delivered.length,revenue:delivered.reduce((s,o)=>s+(Number(o.total)||0),0),assigned:mine.length};
 app.innerHTML='<div class="hero"><div><div class="muted">Xin chào</div><h1>Trung tâm tài xế</h1><div id="sub" class="'+(approved?"approved":"notapproved")+'">'+(approved?(online?"🟢 Đang online":"⚪ Đang offline"):"⏳ Chờ Admin duyệt")+'</div></div><button class="btn gray" onclick="logout()">Đăng xuất</button></div>'+
 '<div class="stats"><div class="stat">🛵<div class="muted">Đơn chờ nhận</div><b>'+waiting.length+'</b></div><div class="stat">📦<div class="muted">Đơn của tôi</div><b>'+mine.length+'</b></div><div class="stat"><div class="muted">Trạng thái</div><b style="font-size:16px">'+(approved?(online?"ONLINE":"OFFLINE"):"CHỜ DUYỆT")+'</b></div><div class="stat">✅<div class="muted">Đã giao</div><b>'+driverStats.delivered+'</b></div><div class="stat">💰<div class="muted">Giá trị đơn đã giao</div><b style="font-size:18px">'+money(driverStats.revenue)+'</b></div><div class="stat">⭐<div class="muted">Đánh giá</div><b style="font-size:18px">'+driverRating.toFixed(1)+' / 5</b></div></div>'+
 '<details class="section compact" open><summary>🛵 Trạng thái nhận đơn <span class="section-note">'+(approved?(online?"Đang Online":"Đang Offline"):"Chờ Admin duyệt")+'</span></summary><div class="section-body"><div class="statusbar"><div class="muted">Chỉ Driver đã được duyệt mới có thể Online và nhận đơn.</div><button class="btn '+(online?"orange":"")+'" onclick="toggleOnline()">'+(online?"Tắt Online":"Bật Online")+'</button></div></div></details>'+
 '<details class="section"><summary>👤 Hồ sơ & đánh giá <span class="section-note">Điểm '+driverRating.toFixed(1)+'/5</span></summary><div class="section-body"><div class="card" style="margin:0"><b>⭐ Điểm đánh giá: '+driverRating.toFixed(1)+' / 5</b><div class="muted">Điểm được tính từ đánh giá của khách sau khi đơn hoàn tất.</div></div></div></details>'+
 '<details class="section"><summary>📦 Đơn hàng của tôi <span class="section-note">'+mine.length+' đơn</span></summary><div class="section-body">'+(mine.length?mine.map(o=>card(o,false)).join(""):'<div class="card"><span class="muted">Chưa có đơn đang phụ trách.</span></div>')+'</div></details>'+
 '<details class="section" '+(waiting.length?'open':'')+'><summary>🛵 Đơn đang chờ tài xế <span class="section-note">'+waiting.length+' đơn</span></summary><div class="section-body">'+(approved&&online?(waiting.length?waiting.map(o=>card(o,true)).join(""):'<div class="card"><span class="muted">Hiện không có đơn chờ nhận.</span></div>'):'<div class="card"><span class="muted">Bật Online sau khi được duyệt để nhận đơn.</span></div>')+'</div></details>';
}
async function collectCod(id){
 if(!confirm('Xác nhận đã thu đủ tiền COD từ khách?'))return;
 const {error}=await db.rpc("driver_confirm_cod_collection",{p_order_id:id,p_note:"Tài xế xác nhận đã thu tiền COD"});
 if(error)return alert(error.message);
 await load();
}
async function claim(id){const {error}=await db.rpc("driver_claim_order",{p_order_id:id});if(error)return alert(error.message);await load()}
async function move(id,status){const notes={picked_up:"Tài xế đã lấy hàng",delivering:"Tài xế bắt đầu giao",delivered:"Tài xế xác nhận đã giao"};const {error}=await db.rpc("driver_transition_order",{p_order_id:id,p_next_status:status,p_note:notes[status]});if(error)return alert(error.message);await load()}
function logout(){
 user=null;
 try{localStorage.removeItem("nago_driver_auth")}catch(_){}
 try{sessionStorage.removeItem("nago_driver_auth")}catch(_){}
 Promise.resolve(db.auth.signOut({scope:"local"})).catch(()=>{});
 login();
}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
start();
</script></body></html>
